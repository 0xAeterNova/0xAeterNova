<svg xmlns="http://www.w3.org/2000/svg" width="908" height="802" viewBox="0 0 908 802" role="img" aria-labelledby="title desc">
  <title id="title">Zaid Tawalbeh terminal profile panel</title>
  <desc id="desc">Animated terminal profile panel with rotating professional roles, profile details, skills, and social labels.</desc>
  <defs>
    <linearGradient id="panelBorder" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#263B5C"/>
      <stop offset="0.5" stop-color="#22D3EE" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0.65"/>
      <animate attributeName="x1" values="0;1;0" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="y2" values="1;0;1" dur="9s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="roleGradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="0.48" stop-color="#10B981"/>
      <stop offset="0.72" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#9333EA"/>
      <animate attributeName="x1" values="0;1;0" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="1;0;1" dur="7s" repeatCount="indefinite"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="16" flood-opacity="0.22"/></filter>
    <filter id="noise" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="9"/><feColorMatrix type="saturate" values="0"/></filter>
