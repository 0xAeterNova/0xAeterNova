    <clipPath id="roleClip1"><rect x="0" y="-34" width="0" height="44"><animate attributeName="width" values="0;0;260;260;0;0" keyTimes="0;0.20;0.255;0.375;0.395;1" dur="25s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="roleClip2"><rect x="0" y="-34" width="0" height="44"><animate attributeName="width" values="0;0;190;190;0;0" keyTimes="0;0.40;0.455;0.575;0.595;1" dur="25s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="roleClip3"><rect x="0" y="-34" width="0" height="44"><animate attributeName="width" values="0;0;290;290;0;0" keyTimes="0;0.60;0.655;0.775;0.795;1" dur="25s" repeatCount="indefinite"/></rect></clipPath>
