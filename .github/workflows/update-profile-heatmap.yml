name: Update Profile Heatmap

on:
  workflow_dispatch:
  schedule:
    - cron: "17 0 * * *"

permissions:
  contents: write

concurrency:
  group: profile-heatmap
  cancel-in-progress: true

jobs:
  update-heatmap:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install project metadata
        run: npm ci

      - name: Generate dark and light heatmaps
        env:
          GH_USERNAME: 0xAeterNova
          GH_TOKEN: ${{ secrets.PROFILE_TOKEN }}
        run: npm run generate:heatmap

      - name: Commit updated SVG files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/heatmap/dark.svg assets/heatmap/light.svg
          if git diff --cached --quiet; then
            echo "No heatmap changes to commit."
          else
            git commit -m "chore: update profile heatmap"
            git push
          fi
